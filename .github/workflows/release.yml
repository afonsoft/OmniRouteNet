name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish single-file
        run: |
          dotnet publish src/LLMRouter.Server -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -o out/${{ matrix.rid }}
      - name: Package
        run: |
          cd out/${{ matrix.rid }}
          case "${{ matrix.rid }}" in
            win-*) zip -q ../../llmrouter-${{ matrix.rid }}.zip * ;;
            *) tar -czf ../../llmrouter-${{ matrix.rid }}.tar.gz * ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: llmrouter-${{ matrix.rid }}
          path: out/llmrouter-*
          if-no-files-found: error

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # SPEC-157: SBOM (SPDX) per published artifact
      - uses: anchore/sbom-action@v0
        with:
          target: llmrouter-linux-x64.tar.gz
          format: spdx-json
          artifact-name: sbom-linux-x64.spdx.json
      - uses: anchore/sbom-action@v0
        with:
          target: llmrouter-linux-arm64.tar.gz
          format: spdx-json
          artifact-name: sbom-linux-arm64.spdx.json
      - uses: anchore/sbom-action@v0
        with:
          target: llmrouter-win-x64.zip
          format: spdx-json
          artifact-name: sbom-win-x64.spdx.json
      - uses: anchore/sbom-action@v0
        with:
          target: llmrouter-osx-arm64.tar.gz
          format: spdx-json
          artifact-name: sbom-osx-arm64.spdx.json
      # SPEC-157: build provenance attestations for the published artifacts
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            llmrouter-*.tar.gz
            llmrouter-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            llmrouter-*
            sbom-*.spdx.json
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta (semver tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            afonsoft/llmrouter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
